<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102d27">
    <meta name="description" content="Los Barberos — gestão simples para barbearias.">
    <title>Los Barberos — Em breve</title>
    <style>
      :root {
        color-scheme: dark;
        --forest-950: #102d27;
        --forest-900: #111d1a;
        --forest-700: #285e4c;
        --forest-600: #2f6b5d;
        --paper: #f7f3eb;
        --paper-soft: #eee9df;
        --amber-400: #e1b46e;
        --amber-500: #c58a46;
        --muted: rgba(247, 243, 235, .68);
      }

      * { box-sizing: border-box; }

      html, body { min-height: 100%; }

      body {
        margin: 0;
        background:
          radial-gradient(circle at 20% 15%, rgba(47, 107, 93, .25), transparent 32rem),
          radial-gradient(circle at 90% 85%, rgba(197, 138, 70, .14), transparent 28rem),
          var(--forest-950);
        color: var(--paper);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      a { color: inherit; }

      .page {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        overflow: hidden;
      }

      .card {
        position: relative;
        width: min(100%, 680px);
        padding: clamp(36px, 8vw, 76px) clamp(24px, 8vw, 76px);
        border: 1px solid rgba(225, 180, 110, .22);
        border-radius: 28px;
        background: rgba(17, 29, 26, .82);
        box-shadow: 0 28px 90px rgba(0, 0, 0, .28), inset 0 1px rgba(255, 255, 255, .06);
        text-align: center;
      }

      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 50%;
        width: 112px;
        height: 3px;
        border-radius: 0 0 8px 8px;
        background: var(--amber-400);
        transform: translateX(-50%);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
        text-align: left;
      }

      .brand-mark {
        width: 48px;
        height: 48px;
        display: grid;
        place-items: center;
        border: 1px solid rgba(225, 180, 110, .5);
        border-radius: 13px;
        background: var(--forest-900);
        color: var(--amber-400);
        font: 700 15px Georgia, serif;
        letter-spacing: -.08em;
      }

      .brand-wordmark { display: grid; gap: 3px; }
      .brand-wordmark strong { font: 700 21px Georgia, serif; letter-spacing: -.04em; }
      .brand-wordmark small { color: var(--muted); font-size: 10px; letter-spacing: .12em; text-transform: uppercase; }

      .eyebrow {
        margin: 0 0 14px;
        color: var(--amber-400);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .18em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 540px;
        margin: 0 auto;
        color: var(--paper);
        font: 700 clamp(38px, 7vw, 68px)/.98 Georgia, "Times New Roman", serif;
        letter-spacing: -.055em;
      }

      .message {
        max-width: 430px;
        margin: 22px auto 30px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .whatsapp-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        min-height: 52px;
        padding: 0 22px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: var(--amber-400);
        color: var(--forest-950);
        font-size: 14px;
        font-weight: 800;
        text-decoration: none;
        transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
      }

      .whatsapp-link:hover { background: #f0c981; box-shadow: 0 10px 24px rgba(225, 180, 110, .2); transform: translateY(-2px); }
      .whatsapp-link:focus-visible { outline: 3px solid var(--paper); outline-offset: 4px; }

      .whatsapp-icon { width: 21px; height: 21px; fill: currentColor; }

      footer { margin-top: 42px; color: rgba(247, 243, 235, .38); font-size: 11px; }

      @media (max-width: 520px) {
        .page { padding: 18px 14px; }
        .card { border-radius: 22px; }
        .brand { margin-bottom: 38px; }
        .message { font-size: 15px; }
        .whatsapp-link { width: 100%; }
      }

      @media (prefers-reduced-motion: reduce) {
        .whatsapp-link { transition: none; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card" aria-labelledby="page-title">
        <div class="brand" aria-label="Los Barberos — gestão para barbearias">
          <span class="brand-mark" aria-hidden="true">LB</span>
          <span class="brand-wordmark">
            <strong>Los Barberos</strong>
            <small>gestão para barbearias</small>
          </span>
        </div>

        <p class="eyebrow">Estamos preparando algo novo</p>
        <h1 id="page-title">Página em construção</h1>
        <p class="message">Em breve, um novo jeito de administrar a sua barbearia. Quer saber mais?</p>

        <a
          class="whatsapp-link"
          href="https://wa.me/5547999782545?text=Ol%C3%A1%2C%20quero%20saber%20mais%20sobre%20a%20Los%20Barberos."
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.5 3.5A11.85 11.85 0 0 0 12.07 0C5.52 0 .19 5.33.19 11.88c0 2.09.55 4.13 1.59 5.93L.09 24l6.33-1.66a11.86 11.86 0 0 0 5.65 1.44h.01c6.55 0 11.88-5.33 11.88-11.88 0-3.18-1.23-6.16-3.46-8.4Zm-8.42 18.17h-.01a9.8 9.8 0 0 1-5-1.37l-.36-.21-3.76.99 1-3.66-.23-.38a9.78 9.78 0 0 1-1.5-5.16C2.22 6.47 6.64 2.05 12.08 2.05a9.8 9.8 0 0 1 6.96 2.89 9.79 9.79 0 0 1 2.88 6.97c0 5.44-4.42 9.76-9.84 9.76Zm5.37-7.32c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.47-.89-.79-1.49-1.77-1.67-2.07-.17-.3-.02-.46.13-.61.14-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.5s1.07 2.9 1.22 3.1c.15.2 2.1 3.2 5.09 4.49.71.31 1.27.5 1.7.64.72.23 1.38.2 1.9.12.58-.09 1.77-.72 2.02-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z" />
          </svg>
          Falar pelo WhatsApp
        </a>

        <footer>losbarberos.com.br</footer>
      </section>
    </main>
  </body>
</html>

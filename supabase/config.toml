project_id = "los-barberos"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback**",
  "http://127.0.0.1:3000/auth/callback**",
  "https://losbarberos-app.vercel.app/auth/callback**",
]
jwt_expiry = 3600
enable_signup = true

[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""

[edge_runtime]
enabled = true
policy = "per_worker"

# Provider callbacks authenticate with their own signed protocol. They cannot
# present a Supabase user JWT. Every handler still validates signature/state.
[functions.stripe-webhook]
verify_jwt = false

[functions.mercado-pago-oauth-callback]
verify_jwt = false

[functions.mercado-pago-webhook]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-embedded-signup-start]
verify_jwt = true

[functions.whatsapp-embedded-signup-callback]
verify_jwt = false

[functions.whatsapp-qr-start]
verify_jwt = true

[functions.whatsapp-qr-webhook]
verify_jwt = false

[functions.whatsapp-qr-health]
verify_jwt = false

[functions.whatsapp-qr-status]
verify_jwt = true

[functions.whatsapp-v2-dispatcher]
verify_jwt = true

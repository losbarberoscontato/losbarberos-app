<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#153f35" />
    <title>Sem conexão · Los Barberos</title>
    <style>
      *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f3eb;color:#18322c;font-family:Inter,ui-sans-serif,system-ui,sans-serif}.card{width:min(100%,480px);padding:42px;text-align:center;background:#fff;border:1px solid #e4ded2;border-radius:28px;box-shadow:0 22px 70px rgba(29,48,42,.12)}.mark{width:54px;height:54px;display:grid;place-items:center;margin:0 auto 34px;border-radius:18px;background:#153f35;color:#f0c47c;font-family:Georgia,serif;font-weight:800}.icon{width:68px;height:68px;display:grid;place-items:center;margin:0 auto 22px;border-radius:50%;background:#f4ead9;font-size:30px}small{color:#aa6f2c;font-weight:800;text-transform:uppercase;letter-spacing:.12em}h1{margin:10px 0 12px;font:700 34px/1.05 Georgia,serif}p{margin:0 auto 26px;max-width:360px;color:#66736f;line-height:1.6}a{display:inline-flex;padding:13px 22px;border-radius:12px;background:#153f35;color:#fff;text-decoration:none;font-weight:800}.note{display:block;margin-top:22px;color:#8a928f;font-size:12px;text-transform:none;letter-spacing:0;font-weight:500}@media(max-width:520px){.card{padding:34px 22px;border-radius:22px}h1{font-size:29px}}
    </style>
  </head>
  <body>
    <main class="card">
      <span class="mark">LB</span>
      <span class="icon" aria-hidden="true">⌘</span>
      <small>Sem conexão</small>
      <h1>A internet deu uma pausa.</h1>
      <p>Agenda, clientes e pagamentos não ficam em cache. Reconecte para continuar com segurança.</p>
      <a href="/cliente/agendar">Tentar novamente</a>
      <small class="note">Nenhuma alteração foi enviada.</small>
    </main>
  </body>
</html>
